name: Release on Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (must start with v), e.g. v1.2.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          case "${TAG_NAME}" in
            v*) ;;
            *)
              echo "Tag '${TAG_NAME}' is invalid. It must start with 'v'."
              exit 1
              ;;
          esac

          ARCHIVE_NAME="TeX-AST-Template-${TAG_NAME}.zip"
          TYPST_ARCHIVE_NAME="Typ-AST-Template-${TAG_NAME}.zip"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "typst_archive_name=${TYPST_ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release archive from LaTeX
        run: |
          ARCHIVE_NAME="${{ steps.vars.outputs.archive_name }}"
          cd LaTeX
          zip -r "../${ARCHIVE_NAME}" . -x ".gitignore"
          cd ..

      - name: Create release archive from Typst
        run: |
          TYPST_ARCHIVE_NAME="${{ steps.vars.outputs.typst_archive_name }}"
          cd Typst
          zip -r "../${TYPST_ARCHIVE_NAME}" . -x "*.pdf" -x "_check.typ" -x ".gitignore" -x "examples/*" -x "examples/"
          cd ..

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: TeX-Typ-AST ${{ steps.vars.outputs.tag_name }}
          files: |
            ${{ steps.vars.outputs.archive_name }}
            ${{ steps.vars.outputs.typst_archive_name }}
